name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show Python version
        run: python3 --version
      - name: Check Python syntax
        run: python3 -m compileall -q Simple_Calculator_Lab Beyond_Calculator_Projects tests
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
